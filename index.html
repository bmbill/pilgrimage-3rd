<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B3558">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="朝聖團流程">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>憶師恩朝聖團 3rd 隨身流程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: phone-first field guide — sticky day rail on top, time spine down the left, bottom tab bar for 流程 / 講稿 / 空檔 */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#16223A; --muted:#5B677B; --line:#D9DFE8;
  --navy:#1B3558; --navy-ink:#FFFFFF; --saffron:#B8741A; --saffron-soft:#F6E7CF; --now:#B8741A;
  --g-edu:#3756A6; --g-food:#2C7D53; --g-tra:#0D7480; --g-adm:#A8445A;
  --g-car:#6B4FA0; --g-car-bg:#ECE6F5; --ok:#2C7D53; --ok-bg:#DDF0E4; --warn:#9A6A00; --warn-bg:#F8ECC8; --bad:#B23A3A; --bad-bg:#F8DEDE;
  --g-edu-bg:#E6EBF7; --g-food-bg:#E3F1E8; --g-tra-bg:#DFF0F1; --g-adm-bg:#F6E4E8;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --script-size:18px; --ov-bg:rgba(10,16,26,.92);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1520; --surface:#162030; --sunk:#1C2839; --ink:#E5EAF2; --muted:#9AA5B7; --line:#273548;
  --navy:#12233B; --navy-ink:#F1F4F9; --saffron:#E3A44A; --saffron-soft:#3A2C17; --now:#E3A44A;
  --g-edu:#9DB2F0; --g-food:#86D0A6; --g-tra:#7DD0D8; --g-adm:#F0A2B3;
  --g-car:#C3AEEB; --g-car-bg:#2C2342; --ok:#86D0A6; --ok-bg:#183A29; --warn:#F0C766; --warn-bg:#3D3112; --bad:#F29A9A; --bad-bg:#46201F;
  --g-edu-bg:#1F2B48; --g-food-bg:#18342A; --g-tra-bg:#123338; --g-adm-bg:#3A1F28;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#162030; --sunk:#1C2839; --ink:#E5EAF2; --muted:#9AA5B7; --line:#273548;
  --navy:#12233B; --navy-ink:#F1F4F9; --saffron:#E3A44A; --saffron-soft:#3A2C17; --now:#E3A44A;
  --g-edu:#9DB2F0; --g-food:#86D0A6; --g-tra:#7DD0D8; --g-adm:#F0A2B3;
  --g-car:#C3AEEB; --g-car-bg:#2C2342; --ok:#86D0A6; --ok-bg:#183A29; --warn:#F0C766; --warn-bg:#3D3112; --bad:#F29A9A; --bad-bg:#46201F;
  --g-edu-bg:#1F2B48; --g-food-bg:#18342A; --g-tra-bg:#123338; --g-adm-bg:#3A1F28;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);box-shadow:0 1px 0 rgba(0,0,0,.15);transition:transform .25s ease}
.top.hide{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
.top .wrap{padding-block:10px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-size:18px;margin:0;letter-spacing:.04em;text-wrap:balance}
.brand h1 sup{font-size:.6em}
.brand .clock{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.day{border:0;background:transparent;color:inherit;opacity:.72;padding:6px 0 8px;border-bottom:3px solid transparent;cursor:pointer;line-height:1.2}
.day b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.day span{font-size:11px;letter-spacing:.05em}
.day[aria-selected="true"]{opacity:1;border-bottom-color:var(--saffron)}
.day.today b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--saffron);margin-left:3px;vertical-align:middle}

.groups{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

main{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.view{padding-block:8px 24px}

/* day heading */
.dayhead{padding-block:14px 6px}
.dayhead .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--saffron);font-weight:700}
.dayhead h2{font-family:var(--f-display);font-size:24px;margin:2px 0 4px;line-height:1.3;text-wrap:balance}
.dayhead p{margin:0;color:var(--muted);font-size:13px}

.ridesum{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:thin}
.ridepill{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--saffron);background:var(--saffron-soft);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;max-width:260px}
.ridepill svg{flex:none;color:var(--saffron)}
.ridepill b{font-variant-numeric:tabular-nums;font-size:14px;display:block}
.ridepill span{font-size:12px;color:var(--muted);display:block}

/* timeline */
.tl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px}
.slot .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;letter-spacing:-.02em;line-height:1.25;padding-top:12px;text-align:right;color:var(--ink)}
.slot .time small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.slot.now .card{border-color:var(--now);box-shadow:0 0 0 2px var(--now)}
.slot.now .time{color:var(--now)}
.slot.next .card{border-color:var(--now)}
.nowtag.nx{background:none;color:var(--now);box-shadow:inset 0 0 0 1px var(--now)}
.nowtag{display:inline-block;background:var(--now);color:var(--surface);font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:2px}
.slot.past .card{opacity:.6}
.card h3{margin:0;font-size:16px;line-height:1.4;font-weight:700}
.card .sub{color:var(--muted);font-size:13px;margin-top:1px}
.tasks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.tag{font-size:12px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap;line-height:1.6}
.t-edu{color:var(--g-edu);background:var(--g-edu-bg)}
.t-food{color:var(--g-food);background:var(--g-food-bg)}
.t-tra{color:var(--g-tra);background:var(--g-tra-bg)}
.t-adm{color:var(--g-adm);background:var(--g-adm-bg)}
.task ul{margin:0;padding-left:1.1em;font-size:14px}
.task li+li{margin-top:1px}
.free{margin-top:8px;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:5px 9px}
.ridebtn{margin-top:10px;display:flex;align-items:center;gap:8px;width:100%;border:1px dashed var(--saffron);background:var(--saffron-soft);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font-size:14px}
.ridebtn svg{color:var(--saffron);flex:none}
details.note{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:13px}
details.note summary{cursor:pointer;color:var(--saffron);font-weight:500}
details.note table{border-collapse:collapse;margin-top:6px;font-size:13px;width:100%}
details.note td,details.note th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
details.note p{margin:6px 0}
details.note ul{margin:4px 0;padding-left:18px}
details.note li{margin:6px 0;line-height:1.7}
details.note .cue{display:block;font-size:.92em;color:var(--muted);background:var(--sunk);border-radius:6px;padding:6px 8px}

/* rides view */
.ride{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.ride>header{background:var(--navy);color:var(--navy-ink);padding:12px 14px}
.ride>header .when{font-size:12px;letter-spacing:.08em;opacity:.85;font-variant-numeric:tabular-nums}
.ride>header h3{font-family:var(--f-display);margin:2px 0 0;font-size:19px;line-height:1.35}
.ride .facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.ride .facts dt{color:var(--muted);white-space:nowrap}
.ride .facts dd{margin:0}
.script{padding:6px 14px 14px;font-size:var(--script-size);line-height:1.8}
.script .sb{border-top:1px solid var(--line)}
.script .sbbar+.sb{border-top:0}
.script .sb summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:8px;padding:10px 0;font-size:15px;font-weight:700;color:var(--ink);line-height:1.4}
.script .sb summary::-webkit-details-marker{display:none}
.script .sb summary::before{content:'▸';color:var(--saffron);font-size:14px;transition:transform .15s}
.script .sb[open] summary::before{transform:rotate(90deg)}
.script .sb[open] summary{color:var(--saffron)}
.script .sb > p:last-child{margin-bottom:14px}
.script h4{font-size:13px;letter-spacing:.1em;color:var(--saffron);margin:16px 0 4px;font-weight:700}
.script p{margin:0 0 10px}
.script .dwlink{color:var(--saffron);font-weight:700}
.script .cue{font-size:.8em;color:var(--muted);background:var(--sunk);border-radius:6px;padding:4px 8px;display:block}
.script .fill{background:var(--saffron-soft);border-radius:4px;padding:0 4px;font-size:.9em}
.ride details>summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--saffron);display:flex;justify-content:space-between}
.ride details>summary::-webkit-details-marker{display:none}
.ride details[open]>summary .arrow{transform:rotate(180deg)}
.sizer{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding-block:10px 0;font-size:13px;color:var(--muted)}
.sbbar{display:flex;justify-content:flex-end;padding-top:6px}
.sball{border:1px solid var(--saffron);color:var(--saffron);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.sizer button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:34px;cursor:pointer;font-weight:700}

/* free matrix */
.legend{font-size:13px;color:var(--muted);margin:6px 0 0}
.mx-wrap{overflow-x:auto;margin-top:12px}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.mx th,table.mx td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
table.mx tr:last-child td{border-bottom:0}
table.mx th{font-size:12px;background:var(--sunk);position:sticky;top:0}
table.mx td.lab{text-align:left;min-width:0}
table.mx td.lab b{font-variant-numeric:tabular-nums;display:block;font-size:12px;color:var(--muted);font-weight:500}
.dot{display:inline-block;width:22px;height:22px;border-radius:6px;line-height:22px;font-size:12px;font-weight:700}
.dot.on.edu{background:var(--g-edu-bg);color:var(--g-edu)}
.dot.on.food{background:var(--g-food-bg);color:var(--g-food)}
.dot.on.tra{background:var(--g-tra-bg);color:var(--g-tra)}
.dot.on.adm{background:var(--g-adm-bg);color:var(--g-adm)}
.dot.off{color:var(--muted);opacity:.5}
.mx tr.now td{background:var(--saffron-soft)}
.loadsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.loadsum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.loadsum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.loadsum span{font-size:12px;color:var(--muted)}


.t-car{color:var(--g-car);background:var(--g-car-bg)}
button.dot{border:0;cursor:pointer;font:inherit;font-weight:700;width:30px;height:28px;line-height:28px;padding:0}
.dot.low{background:var(--ok-bg);color:var(--ok)}
.dot.mid{background:var(--warn-bg);color:var(--warn)}
.dot.high{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.dot.carx{background:var(--g-car-bg);color:var(--g-car)}
.dot.off{background:none;color:var(--muted)}
table.mx th,table.mx td{padding:6px 3px}
table.mx td.lab{padding-left:8px}
.dot.sel{outline:2px solid var(--ink);outline-offset:1px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-left:4px}
.sw.low{background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok)}
.sw.mid{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn)}
.sw.high{background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad)}
.loadsum{grid-template-columns:repeat(3,minmax(0,1fr))}
.loadsum .ls{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer}
.loadsum .ls.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.loadsum .ls b{font-size:15px}
.loadsum .ls em{font-style:normal;color:var(--bad);font-weight:700}
.mpanel{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.mlist li{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mlist small{color:var(--muted)}
.mnote{font-size:13px;color:var(--muted);margin:8px 0 0}
.fd-h{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
tr.fd td{background:var(--sunk);text-align:left;font-size:14px}
tr.fd ul{margin:6px 0;padding-left:1.2em}
tr.fd p{margin:6px 0}
.fd-m{color:var(--muted);font-size:13px}
.bal{display:block;font-size:10px;line-height:1.2;margin-top:2px;font-weight:700}
.bal.pos{color:var(--ok)} .bal.neg{color:var(--bad)}
.fd-bal{font-weight:700;margin:8px 0 2px!important}
.fd-bal.neg{color:var(--bad)} .fd-bal.pos{color:var(--ok)}
.fd-sup{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.fd-sup ul{list-style:none;padding:0!important;margin:6px 0 0!important;display:flex;flex-direction:column;gap:4px}
.fd-sup li{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fd-sup small{color:var(--muted)}
/* status bar */
.status{padding-block:6px 8px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;line-height:1.5}
.status .sline>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .lab.nx{background:transparent;color:var(--saffron);box-shadow:inset 0 0 0 1px var(--saffron)}
.status .lab{display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:var(--saffron);border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1px}
.status small{opacity:.8;margin-left:2px}
.schips{display:flex;gap:6px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
.schips::-webkit-scrollbar{display:none}
.schip{flex:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--navy-ink);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.schip.line{background:var(--saffron);border-color:var(--saffron);color:var(--navy);font-weight:700}
.seatbtn{margin-top:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
/* info view */
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.jump a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px}
.isec{margin-top:22px}
.isec h3{font-family:var(--f-display);font-size:19px;margin:0 0 4px}
.hint{font-size:13px;color:var(--muted);margin:2px 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 4px;cursor:pointer;font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cars{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:600px){.cars{grid-template-columns:repeat(2,minmax(0,1fr))}}
.carcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.carcard header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.carcard header b{font-size:17px}
.cnt{font-size:13px;color:var(--muted)}
.cnt em{font-style:normal;font-size:20px;font-weight:700;color:var(--saffron);font-variant-numeric:tabular-nums}
.stop{font-size:13px;margin-top:2px;color:var(--g-tra);font-weight:500}
.carcard ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.carcard li{display:grid;grid-template-columns:42px 48px minmax(0,1fr);gap:6px;align-items:baseline;font-size:14px}
.cls{font-weight:700}
.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.cfoot{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.figs{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:600px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.figs figure{margin:0}
.figbtn{border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--surface);cursor:zoom-in;display:block;width:100%}
.figbtn img{display:block;width:100%;height:auto}
.figs figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.linemsg{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:8px}
.linemsg summary{cursor:pointer;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.linemsg summary span{font-size:12px;color:var(--muted)}
.linemsg summary b{font-size:14px}
.linemsg pre{margin:0 12px;white-space:pre-wrap;font-family:var(--f-body);font-size:14px;line-height:1.7;background:var(--sunk);border-radius:8px;padding:10px;user-select:text;-webkit-user-select:text}
.copybtn{margin:10px 12px 12px;border:0;background:var(--saffron);color:var(--surface);font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer}
.place{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.place header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.place header span{font-size:12px;color:var(--muted)}

  note:{sum:'大威德金剛簡介（白話重點＋原文）',html:'<p><b>重點整理（口語，可以直接唸）</b></p><ul><li><b>祂是誰？</b>大威德金剛是文殊菩薩的「忿怒相」。文殊菩薩代表智慧；祂看起來很兇，其實是大慈悲——當時死主閻摩傷害了很多眾生，諸佛請文殊菩薩去降伏，文殊菩薩就現出這個威猛的樣子，讓眾生早日脫離死亡的恐懼。</li><li><b>為什麼長這樣？</b>身體是深藍色，代表智慧；九個頭代表佛陀的九類教法；兩支角代表世俗、勝義二諦；三十四隻手，加上身、語、意，正好是修行的三十七道品；十六隻腳代表十六種空性。祂的「兇」不是生氣，是用像金剛一樣堅固的智慧，降伏我們心裡的我執和煩惱。</li><li><b>跟我們有什麼關係？</b>宗喀巴大師的本尊就是大威德金剛，大師一生修行，好幾次得到祂的指導和加持。大師說過：「上師是文殊，本尊是文殊，護法還是文殊。」所以跟隨宗大師傳承、學廣論的弟子，都特別依止大威德金剛。</li><li><b>一個小故事：</b>宗大師出生的前一年，義成寶法王夢到大威德金剛對他說：「我明年會來到這個村莊。」隔年大師出生，法王就知道這個孩子很不平凡，後來大師從小就跟著這位法王學佛。</li></ul><p style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px"><b>手冊原文</b></p><p>至尊文殊之憤怒化身大威德金剛，為令一切有情速速脫離死主之摧殘，以大威猛之相鎮壓一切怖畏。現出此憤怒形相的因緣，是因為當時閻摩傷害了許多的眾生，十方諸佛便勸至尊文殊前往調伏，於是文殊菩薩來到地底下閻摩的住處，顯現為大威德形相，以十六足鎮壓十六無門鐵城，以中心密輪鎮壓廣大鐵城，發出哈哈嘿嘿等八種笑聲，並以大慈悲心作意調伏閻摩及其眷屬。</p><p>主尊大威德金剛，身相極其威猛，其體色深藍(深藍代表智慧)，九面，三十四臂，十六足，呈現踡右展左之姿態。黑根本面水牛容顏，至極忿怒尖角銳利。諸面極其忿怒，此九顏面全部悉皆具足三眼，主尊懷中佛母靛藍金剛起屍母。(象徵以金剛般不可摧毀的智慧，徹底降伏我執、煩惱與生死無明)。</p><p>身相所表示之意涵，九面者代表佛陀的九類教法；二角者為世俗與勝義二諦； 三十四臂與身語意三，顯示三十七道品，即四念住、四正勤、四神足、五根、五力、七覺支、八正道；十六足為十六空性。與佛母和合顯大樂極增盛。右足踏諸人等，謂八種悉地位；左足踏諸鶩鷹等，謂八種清淨自在功德。裸露表無覆無蓋；髮絲向上直衝乃顯示涅槃果位。</p><p>宗喀巴大師的本地風光即大威德金剛，大威德金剛也在大師一生的修行過程多次指導並給予加持。宗喀巴大師曾說：「在我的教法傳承裡，上師是文殊，本尊是文殊，護法神還是文殊，一切依賴文殊而成事是至關重要的」，所以後世的隨學弟子都至心依止大威德金剛。</p><p>在宗大師出生前一年，住在大師家鄉的義成寶法王，夢見大威德金剛對他說：「我將在明年來到這個村莊。」一年後，義成寶法王依夢兆來到村莊裡，發現大師剛剛降生，馬上明白大師的殊勝身份，在大師出生後，義成寶法王給予了大師父母很多供養以及甘露丸等，同時再三囑咐他們夫婦，一定要妥善照顧宗喀巴大師的靈童，稍長後大師即依止義成寶法王學習佛法。在大師還沒出家以前，法王便讓他進入密咒金剛乘的大門。</p>'}},

  {h:'今天要去哪裡',p:['今天的主題是「歡喜建寺，跟到成佛」，我們要去朝禮月稱光明寺，車程大約一個半小時。','「月稱」這兩個字，取自印度的月稱菩薩。月稱菩薩是龍樹菩薩中觀思想最重要的傳人之一，宗喀巴大師的中觀見，很大一部分就是依止月稱菩薩的論典。所以這座寺院的名字本身，就帶著我們廣論學習的傳承。','昨天晚上前行緣念，大家看了真如老師談歡喜建寺的影片。今天到了現場，可以想一想：這一磚一瓦，是多少師兄師姐一起發心護持才建起來的。我們今天去，不只是參觀，而是去看見大家共同的願力。']},
  {h:'今天的流程',p:['到了以後，9:30 在義工佛堂，由沈文良主任為我們介紹建寺緣起。下車後請跟著我手上的車牌走，我們會先帶大家上洗手間，再入座。','10:45 是出坡。有 11 位師兄師姐負責掃廣場和山門，其他人擦欄杆，分區我們到了再跟大家說。出坡就是用自己的身體去護持道場，請大家帶著歡喜心來做。','出坡結束後，大家回到義工佛堂吃便當、休息一下。喝湯有準備碗和湯匙，用完請到水站自己把餐具洗乾淨。13:20 在華藏樓拍大合照，接著是華藏樓的導覽和課程，會發加持物給大家。','16:00 到 16:45 分三批去拜見大威德金剛、供燈。第一、二車是 A 組，第三、四車 B 組，第五、六車 C 組。大威德金剛是文殊菩薩的忿怒相，也是宗喀巴大師非常重要的本尊。<a href="#d1" class="dwlink" data-dw="1">大威德金剛（口說版）</a>','17:00 結行上車，晚餐就在車上吃便當，途中會停湖口休息站。']},
  {h:'貼心提醒',p:['寺院裡請輕聲細語，手機調成靜音。要拍照的地方，請先看一下有沒有禁止拍照的告示。','需要換百元鈔的香港、馬來西亞師兄師姐，到寺裡後 9:20 行政組會來跟大家收要換的錢，統一兌換。','膝蓋或行動比較不方便的，請先跟我說，我們會安排接駁，不用勉強。','朝聖團名牌請務必隨身佩戴：它是憶師恩法會的入場證，也是朝聖團所有活動的識別證。']},
  {h:'車上前行',p:['接下來的車程，我們一起靜下心來。可以閉上眼睛，想一想這趟出發的初心：為什麼報名這次朝聖？希望帶什麼回去？','這一趟的朝禮、出坡、供養都非常殊勝：朝禮是親近道場，出坡是用身體護持，供養是把最好的獻給三寶。帶著這樣的心進寺，收穫會很不一樣。','<span class="cue">可帶大家合掌一起祈願，之後讓大家安靜休息。快到月稱光明寺時，帶大家一起誦密集嘛；再提醒整理隨身物品。</span>','快到了，請大家檢查一下座位上的東西，水杯、外套、手機都帶好，我們準備下車。']}
 ]},

  {h:'車上前行',p:['接下來這段路，邀請大家一起靜下心。可以想一想：這一年來，我在學習上最感謝師長的是哪一件事？帶著這份感恩進入法會。','<span class="cue">帶大家一起唱傑仁波切、誦密集嘛，然後安靜休息。到前 5 分鐘提醒帶好外套、水杯。</span>']}

r5:{day:'d3',when:'11/2（一）08:00–09:10・約 70 分鐘',title:'福容飯店 → 麻布山林（秘境探索 心之旅）',
 facts:[['發車','7:40 第 1–2 車・7:50 第 3–4 車・8:00 第 5–6 車'],['到達','麻布山居前下車，行李依各車立牌寄放山居 1 樓「孟竹廳」；9:30 詠山館上課'],['園區','用餐：入口右側富森餐廳・上課：詠山館・住宿：麻布山居、麻布雅舍'],['課程','如亨法師「秘境.探索～心.之.旅」'],['今晚','讚頌之夜（夜來香＆光之勇士）、綠色療癒前行']],
 script:[
  {h:'開場',p:['師兄師姐早安！行李都上車了嗎？我們點一下名。','<span class="cue">點名完回報交通組。</span>','前面三天是朝禮、出坡、法會，比較奔波。從今天開始，我們要到麻布山林住兩個晚上，節奏會慢下來，車程大約一個多小時。']},
  {h:'麻布山林介紹（快到時唸）',p:['歡迎來到 麻布山林。這裡是友達光電教育訓練中心，園區總面積達 33 公頃，其中 10 公頃為已開發活動區域，23 公頃則保留為原始山林保護區。','自 2005 年成立以來，麻布山林始終秉持「低密度開發」及「山林復育」兩大經營理念，致力降低人為干擾，並積極栽植台灣原生種植物。園區兼具「生態教育、環境保育、物種復育」三大功能，不僅維護珍貴的生物多樣性，也展現自然、生態與人文和諧共存的精神。','希望大家能善用接下來兩天的時間，深入探索這座山林秘境，用心感受大自然帶來的寧靜與能量。','<b>下車前提醒：</b>行李寄放：請將行李統一放置於入口左側「麻布山居」1 樓。<br>住宿安排：本次住宿地點分別為「麻布山居」及「麻布雅舍」。<br>用餐地點：請至入口右側的「富森餐廳」用餐。<br>課程地點：這兩天課程於「詠山館」進行。']},
  {h:'接下來兩天',p:['這兩天的課程叫「秘境.探索～心.之.旅」，由如亨法師帶領。「秘境」是山林，也是我們自己的內心；在山裡放慢腳步，回頭看看自己的心。','上課地點在詠山館，座位已經依照 M31 座位圖排好，到了會用投影機播出來，大家依座位坐就可以。','用餐在富森餐廳，桌次也排好了，這兩天都坐同一桌。']},
  {h:'到了以後怎麼做',p:['車子會停在麻布山居前面。<b>大行李寄放到麻布山居 1 樓的孟竹廳，請放在我們這一車的立牌位置</b>，只要背著隨身背包，跟著我的車牌走到詠山館，9:30 開始上課。','房卡下午行政組會發給生活班長，17:00 上完課再 Check in，所以早上不用急著進房間。','山裡蚊子比較多，記得擦防蚊液；早晚溫差大，薄外套放在背包裡。']},
  {h:'今晚與明早',p:['今天晚上 19:00 是讚頌之夜，有夜來香和光之勇士的演出。之後有綠色療癒前行，會說明明天早上的課程。','明天早上 6:30 綠色療癒課程分兩組：A 步道組有上下坡，B 平地組比較適合膝蓋不舒服的人。今天晚上大家可以先想一想自己要參加哪一組。']},
  {h:'車上前行',p:['接下來的路，邀請大家看看窗外，讓心慢慢安靜。進山之前，把這幾天的忙碌放下，準備好好聽法。','<span class="cue">安靜休息；到前 10 分鐘提醒拿好隨身背包、確認大行李。</span>']}
 ]},

function myEvents(p){

      else rest.push(`${tag(k)}${t}`);
    }));
    if(rest.length){
      const hm=x=>{const [a,b]=x.split(':').map(Number);return a*60+b};const dur=s.e?Math.max(15,hm(s.e)-hm(s.t)):30;
      let desc=rest.join('\n');if(s.sub)desc=s.sub+'\n'+desc;
      if(s.ride&&p.groups.includes('car'))desc+=`\n車長講稿：${SITE}#${s.ride}`;

}
function icsTime(date,t,add){const [y,mo,dd]=date.split('-').map(Number),[h,mi]=t.split(':').map(Number);const x=new Date(Date.UTC(y,mo-1,dd,h-8,mi+(add||0)));return `${x.getUTCFullYear()}${pad2(x.getUTCMonth()+1)}${pad2(x.getUTCDate())}T${pad2(x.getUTCHours())}${pad2(x.getUTCMinutes())}00Z`}
function icsEsc(x){return x.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsFold(line){const enc=new TextEncoder();let out='',cur='',n=0,lim=75;for(const ch of line){const b=enc.encode(ch).length;if(n+b>lim){out+=cur+'\r\n ';cur='';n=0;lim=74}cur+=ch;n+=b}return out+cur}
function toICS(p){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//yishien-3rd//pilgrimage//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('朝聖團 '+p.name),'X-WR-TIMEZONE:Asia/Taipei'];
  myEvents(p).forEach(e=>L.push('BEGIN:VEVENT',`UID:${e.uid}-${p.id}@yishien-3rd`,'DTSTAMP:20261029T000000Z',`DTSTART:${icsTime(e.date,e.t)}`,`DTEND:${icsTime(e.date,e.t,e.dur)}`,'SUMMARY:'+icsEsc(e.title),'DESCRIPTION:'+icsEsc(e.desc+'\n\n隨身流程：'+SITE),'URL:'+SITE,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),`TRIGGER:-PT${REMIND_MIN}M`,'END:VALARM','END:VEVENT'));
  L.push('END:VCALENDAR');return L.map(icsFold).join('\r\n')+'\r\n';
}

function taipeiNow(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return {date:`${o.year}-${o.month}-${o.day}`,min:(+o.hour%24)*60+(+o.minute),hm:`${o.hour%24}:${o.minute}`}}
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
function slotEnd(day,i){const s=day.slots[i];if(s.e)return toMin(s.e);const n=day.slots[i+1];return n?toMin(n.t):toMin(s.t)+30}
function nowIndex(day){const n=taipeiNow();if(n.date!==day.date)return {i:-1,state:n.date<day.date?'future':'past'};let cur=-1;day.slots.forEach((s,i)=>{if(n.min>=toMin(s.t)&&n.min<slotEnd(day,i))cur=i});return {i:cur,state:'today',min:n.min}}

  if(S.group!=='all'&&!has(s,S.group)){

/* 某時段某組的可用人數與負載 */
function load(s,k){
  if(k==='car')return {n:12,avail:12,tasks:has(s,k)?s[k].length:0,state:has(s,k)?'mid':'free'};
  const m=MEMBERS[k];const carBusy=false; // 車長同時兼組內事務，不扣人手
  const avail=m.filter(x=>!(carBusy&&x[2])).length;const tasks=has(s,k)?s[k].length:0;

}

    h+=`<a class="calbtn" id="cal-dl" href="${location.protocol.startsWith('http')?`ics/${cal.id}.ics`:'#'}" data-ics="${cal.id}">加入行事曆：${cal.allOf?'全部＋我的':'我的'}（${ev.length} 則提醒）</a>
    <details open><summary>怎麼加入</summary><ol><li><b>iPhone</b>：用 Safari 打開這個網頁，按上方按鈕 →「加入全部」→ 選要放的行事曆 →「完成」。</li><li><b>Android</b>：按上方按鈕下載後，點下載的檔案，用手機的「日曆／行事曆」App 開啟並匯入。</li><li>在 LINE 裡打開網頁時按鈕可能沒反應，請先點右上角「⋯」→「用預設瀏覽器開啟」。</li><li>行程如果改了，請先刪掉舊的提醒，再重新加入一次。</li></ol></details>
    <details><summary>預覽這 ${ev.length} 則提醒</summary><ul class="evl">${ev.map(e=>`<li><b>${e.date.slice(5).replace('-','/')} ${e.t}</b><span>${e.title}</span></li>`).join('')}</ul></details>`}
  h+=`</div></section>`;
  // 各車
  h+=`<section class="isec" id="i-car"><h3>各車人數與生活班長</h3><p class="hint">上車後請各生活班長點自己班的人數，車長加總後回報交通組。</p>`;
  h+=`<div class="seg" role="tablist">${CARMODES.map(m=>`<button role="tab" data-carmode="${m.id}" aria-selected="${m.id===S.carmode}">${m.lab}</button>`).join('')}</div><p class="hint">${mode.tip}</p>`;
  h+=`<div class="cars">${CARSET[S.carmode].map(c=>`<article class="carcard"><header><b>${typeof c.n==='number'?`第 ${c.n} 車`:c.n}</b>${c.total?`<span class="cnt">應到 <em>${c.total}</em> 人</span>`:'<span class="cnt">不搭車</span>'}</header>
    ${c.stop?`<div class="stop">下車點：${c.stop}</div>`:''}
    <ul>${c.rows.map(r=>`<li><span class="cls">${r[0]}</span><span class="num">${r[1]} 人</span><span class="ldr">${r[2]||''}</span></li>`).join('')}</ul>
    <div class="cfoot">${c.total?`學員 ${c.stu}${c.total-c.stu?` ＋ 義工 ${c.total-c.stu}`:''}`:''}${c.vol?`・義工：${c.vol}`:''}${c.lead?`<br>${c.lead}`:''}</div></article>`).join('')}</div></section>`;
  // 座位
  h+=`<section class="isec" id="i-seat"><h3>座位圖、桌次圖、出坡區域</h3><p class="hint">點圖片可以放大。</p><div class="figs">${Object.entries(IMGS).map(([k,v])=>`<figure><button class="figbtn" data-seat="${k}"><img src="${v.src}" alt="${v.t}" loading="lazy"></button><figcaption>${v.t}</figcaption></figure>`).join('')}</div></section>`;
  // LINE
  const n=taipeiNow();
  h+=`<section class="isec" id="i-line"><h3>每晚 LINE 布達</h3><p class="hint">按「複製」後貼到生活班群組。晚上 19:00 之後，上方提示列也會出現當晚的複製按鈕。</p>${Object.entries(LINEMSG).map(([d,txt])=>{const isT=DAYS.find(x=>x.id===d).date===n.date;
    return `<details class="linemsg" ${isT?'open':''}><summary><span>${LINEDAY[d]}發布</span><b>${txt.split('\n')[0]}</b></summary><pre id="lm-${d}">${txt}</pre><button class="copybtn" data-copy="${d}">複製這則訊息</button></details>`}).join('')}</section>`;
  // 地點
  h+=`<section class="isec" id="i-place"><h3>地點與交通</h3>${PLACES.map(p=>`<article class="place"><header><b>${p.n}</b><span>${p.when}</span></header>${p.addr?`<div>${p.addr}</div>`:''}${p.tel?`<div>電話：<span class="sel">${p.tel}</span></div>`:''}<div class="hint">${p.park}</div><div class="plinks"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.q)}" target="_blank" rel="noopener">Google 地圖</a><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('急診 '+p.q)}" target="_blank" rel="noopener">附近急診</a></div></article>`).join('')}<p class="hint">個人手機號碼不放在這裡，請用義工 LINE 群組聯絡。</p></section>`;
  // 緊急
  h+=`<section class="isec" id="i-sos"><h3>緊急狀況處理</h3><div class="sos119">緊急醫療・火警：<b class="sel">119</b>　報案：<b class="sel">110</b></div><dl class="sos">${EMERG.map(e=>`<dt>${e[0]}</dt><dd>${e[1]}</dd>`).join('')}</dl></section>`;
  h+=`<p class="hint" style="margin-top:28px;text-align:center">網頁版本：10/31 15:53（看到的時間不是最新的，請關掉重開）</p>`;
  document.getElementById('v-info').innerHTML=h;
}

/* ===== 頂端提示列 ===== */
function dayDiff(a,b){return Math.round((Date.UTC(...b.split('-').map((x,i)=>i===1?x-1:+x))-Date.UTC(...a.split('-').map((x,i)=>i===1?x-1:+x)))/864e5)}
function renderStatus(){
  const n=taipeiNow(),el=document.getElementById('status');
  const first=DAYS[0],last=DAYS[DAYS.length-1];
  let line='',chips=[];
  if(n.date<first.date){
    line=`距離 10/30 義工進駐還有 <b>${dayDiff(n.date,first.date)}</b> 天・第一項：10:00 義工報到（福容桃園館）`;
  }else if(n.date>last.date){
    line='朝聖圓滿，感恩大家的護持 🙏';
  }else{
    const di=DAYS.findIndex(d=>d.date===n.date),d=DAYS[di];
    if(!d){line='';}else{
      const ni=nowIndex(d);const cur=ni.i>=0?d.slots[ni.i]:null;
      let nxt=d.slots.find(s=>toMin(s.t)>n.min),nxtDay=d;
      if(!nxt&&DAYS[di+1]){nxtDay=DAYS[di+1];nxt=nxtDay.slots[0]}
      line=(cur?`<div><span class="lab">現在</span>${cur.h}${cur.e?`<small>到 ${cur.e}</small>`:''}</div>`:'')+(nxt?`<div><span class="lab nx">下一個</span>${nxtDay!==d?nxtDay.md+' ':''}${nxt.t} ${nxt.h}</div>`:'');
      const seats=[cur,nxtDay===d?nxt:null].filter(s=>s&&s.seat).map(s=>s.seat);
      [...new Set(seats)].forEach(k=>chips.push(`<button class="schip" data-seat="${k}">看${IMGS[k].s}</button>`));
      const ride=d.slots.find((s,i)=>s.ride&&(i===ni.i||toMin(s.t)>n.min));
      if(ride){const m=toMin(ride.t)-n.min;chips.push(`<button class="schip ride" data-ride="${ride.ride}">搭車講稿 ${ride.t}${m>0?`（${m>=60?Math.floor(m/60)+' 小時 ':''}${m%60} 分後）`:'（進行中）'}</button>`)}
      if(LINEMSG[d.id]&&n.min>=19*60)chips.push(`<button class="schip line" data-copy="${d.id}">複製今晚 LINE 布達</button><button class="schip" data-goto="i-line">看內容</button>`);
    }
  }
  el.innerHTML=`<div class="sline">${line}</div>${chips.length?`<div class="schips">${chips.join('')}</div>`:''}`;
}

/* ===== 放大圖、複製 ===== */
function openSeat(k){
  const o=document.getElementById('overlay');o.querySelector('.ov-t').textContent=IMGS[k].t;
  const img=o.querySelector('img');img.src=IMGS[k].src;img.alt=IMGS[k].t;img.classList.remove('big');o.hidden=false;
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}
function copyLine(d){
  const txt=LINEMSG[d];
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){};ta.remove();toast(ok?'已複製，可以貼到 LINE 了':'無法自動複製，請到「資訊」頁長按文字複製')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('已複製，可以貼到 LINE 了'),fallback);else fallback();
}

function render(){
  renderDays();renderGroups();renderStatus();
  ['flow','rides','free','info'].forEach(v=>{document.getElementById('v-'+v).hidden=S.view!==v;document.getElementById('tab-'+v).setAttribute('aria-selected',S.view===v)});
  document.getElementById('days').hidden=S.view==='rides'||S.view==='info';
  document.getElementById('groups').hidden=S.view!=='flow';
  if(S.view==='flow')renderFlow();else if(S.view==='rides')renderRides();else if(S.view==='free')renderFree();else renderInfo();
}
function tick(){const n=taipeiNow();document.getElementById('clock').textContent=`台灣 ${n.date.slice(5).replace('-','/')} ${n.hm.padStart(5,'0')}`}

function jumpTo(id){const t=document.getElementById(id);if(!t)return;t.scrollIntoView({block:'start'});window.scrollBy(0,-document.querySelector('.top').offsetHeight-8)}
const ownGroup=p=>p.id==='chief'?'all':p.groups.includes('car')&&p.groups.length===1?'car':p.groups.find(k=>k!=='car')||'all';
document.addEventListener('toggle',e=>{if(!e.target.classList||!e.target.classList.contains('sb'))return;const box=e.target.closest('.script'),b=box&&box.querySelector('[data-sball]');if(b)b.textContent=[...box.querySelectorAll('.sb')].every(x=>x.open)?'全部收起':'全部展開'},true);
document.addEventListener('change',e=>{
  if(e.target.id==='me-sel'){S.me=e.target.value}else if(e.target.id==='me-all'){S.all=e.target.checked}else return;
  const p=PEOPLE.find(x=>x.id===S.me);if(p)S.group=S.all&&!p.generic?'all':ownGroup(p);
  try{localStorage.setItem('pg-me',S.me);localStorage.setItem('pg-all',S.all?'1':'0');localStorage.setItem('pg-group',S.group)}catch(_){};renderInfo();renderGroups()});
(function(){let last=scrollY;const top=document.querySelector('.top');addEventListener('scroll',()=>{const y=scrollY;if(y>last+6&&y>top.offsetHeight)top.classList.add('hide');else if(y<last-6||y<=0)top.classList.remove('hide');last=y},{passive:true})})();
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').hidden=true});
document.addEventListener('click',e=>{
  if(e.target.id==='ov-close'||e.target.classList.contains('ov-body')){document.getElementById('overlay').hidden=true;return}
  if(e.target.id==='ov-zoom'){const im=document.querySelector('#overlay img');im.classList.toggle('big');e.target.textContent=im.classList.contains('big')?'縮小':'放大';return}
  const seat=e.target.closest('[data-seat]');if(seat){openSeat(seat.dataset.seat);return}
  if(e.target.id==='app-install'&&INSTALL.ev){INSTALL.ev.prompt();INSTALL.ev.userChoice.finally(()=>{INSTALL.ev=null;renderInfo()});return}
  const dw=e.target.closest('[data-dw]');if(dw){e.preventDefault();S.view='flow';S.day='d1';render();const n=[...document.querySelectorAll('details.note')].find(x=>x.querySelector('summary').textContent.includes('大威德金剛'));if(n){n.open=true;n.scrollIntoView({block:'start'});window.scrollBy(0,-document.querySelector('.top').offsetHeight-8)}return}
  const ic=e.target.closest('[data-ics]');if(ic&&!location.protocol.startsWith('http')){e.preventDefault();const p=PEOPLE.find(x=>x.id===ic.dataset.ics);const u=URL.createObjectURL(new Blob([toICS(p)],{type:'text/calendar'}));const a=document.createElement('a');a.href=u;a.download=`朝聖團_${p.name}.ics`;a.click();return}
  const cp=e.target.closest('[data-copy]');if(cp){copyLine(cp.dataset.copy);return}
  const cm=e.target.closest('[data-carmode]');if(cm){S.carmode=cm.dataset.carmode;renderInfo();return}
  const jp=e.target.closest('[data-jump]');if(jp){e.preventDefault();jumpTo(jp.dataset.jump);return}
  const gt=e.target.closest('[data-goto]');if(gt){S.view='info';render();jumpTo(gt.dataset.goto);return}
  const cell=e.target.closest('[data-cell]');if(cell){const [i,k]=cell.dataset.cell.split(':');S.open=(S.open&&S.open.i===+i&&S.open.k===k)?null:{i:+i,k};renderFree();return}
  const mem=e.target.closest('[data-member]');if(mem){S.member=S.member===mem.dataset.member?null:mem.dataset.member;renderFree();return}
  const day=e.target.closest('[data-day]');if(day){S.day=day.dataset.day;S.open=null;if(S.view==='rides')S.view='flow';render();window.scrollTo({top:0});return}
  const g=e.target.closest('[data-group]');if(g){S.group=g.dataset.group;try{localStorage.setItem('pg-group',S.group)}catch(_){};render();return}
  const t=e.target.closest('[data-view]');if(t){S.view=t.dataset.view;render();window.scrollTo({top:0});return}
  const r=e.target.closest('[data-ride]');if(r){S.view='rides';render();const det=document.getElementById('det-'+r.dataset.ride);det.open=true;document.getElementById('ride-'+r.dataset.ride).scrollIntoView({block:'start'});window.scrollBy(0,-document.querySelector('.top').offsetHeight-8);return}
  const sba=e.target.closest('[data-sball]');if(sba){const all=[...document.querySelectorAll(`#det-${sba.dataset.sball} .sb`)];const open=!all.every(x=>x.open);all.forEach(x=>x.open=open);sba.textContent=open?'全部收起':'全部展開';return}
  if(e.target.id==='fs-up'||e.target.id==='fs-dn'){let v=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--script-size'))||18;v=Math.max(14,Math.min(28,v+(e.target.id==='fs-up'?2:-2)));document.documentElement.style.setProperty('--script-size',v+'px');try{localStorage.setItem('pg-fs',v)}catch(_){}}
});

(function init(){
  const n=taipeiNow();const today=DAYS.find(d=>d.date===n.date);
  if(today)S.day=today.id;else if(n.date>DAYS[DAYS.length-1].date)S.day=DAYS[DAYS.length-1].id;
  const hs=location.hash.slice(1);
  if(/^d[0-5]$/.test(hs))S.day=hs;else if(hs==='rides'||hs==='free'||hs==='info')S.view=hs;else if(hs==='me'||hs==='app'){S.view='info'}else if(/^r[1-7]$/.test(hs)){S.view='rides'}
  tick();render();setInterval(()=>{tick();renderStatus();const d=DAYS.find(x=>x.id===S.day);if(S.view!=='rides'&&d.date===taipeiNow().date&&!document.querySelector('details.note[open]'))render()},60000);
  try{history.scrollRestoration='manual'}catch(_){}
  const goNow=()=>{const el=document.querySelector('#v-flow .slot.now')||document.querySelector('#v-flow .slot.next')||[...document.querySelectorAll('#v-flow .slot.past')].pop();if(el)el.scrollIntoView({block:'center'})};
  if(today&&S.view==='flow')setTimeout(goNow,50);
  // 從背景切回來（例如手機鎖屏後再打開）超過 10 分鐘，自動跳回今天、目前的行程
  let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(hiddenAt&&Date.now()-hiddenAt>10*60e3){const t=DAYS.find(x=>x.date===taipeiNow().date);if(t){S.view='flow';S.day=t.id;render();setTimeout(goNow,50)}}});
  if(hs==='me'||hs==='app')setTimeout(()=>jumpTo('i-'+hs),50);
  if(/^r[1-7]$/.test(hs)){const det=document.getElementById('det-'+hs);if(det){det.open=true;document.getElementById('ride-'+hs).scrollIntoView()}}
})();
</script>
